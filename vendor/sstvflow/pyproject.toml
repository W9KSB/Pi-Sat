[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "SSTVFlow"
version = "0.1.1+pisat.20261008"
description = "SSTVFlow: an automatic streaming Robot, Martin, and PD SSTV decoder"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "Pillow>=10"]

[project.scripts]
decoder = "sstv_decoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
